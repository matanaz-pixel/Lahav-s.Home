; Dashie - in-car voice buddy for M5Stack Core2 / CoreS3
; Build:  pio run -e core2     (or -e cores3)
; Flash:  pio run -e core2 -t upload
[platformio]
default_envs = core2

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
lib_deps =
    m5stack/M5Unified@0.2.2
    m5stack/M5GFX@0.2.3
    bblanchon/ArduinoJson@7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -Wno-unused-variable

[env:core2]
board = m5stack-core2
board_upload.flash_size = 16MB
build_flags =
    ${env.build_flags}
    -mfix-esp32-psram-cache-issue

[env:cores3]
board = m5stack-cores3
board_upload.flash_size = 16MB
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
