; Dashie - in-car voice buddy for M5Stack Core2 / CoreS3 / StickC Plus2
; Build:  pio run -e core2     (or -e cores3, plus2, core2_a2dp, plus2_a2dp)
; Flash:  pio run -e core2 -t upload
[platformio]
default_envs = core2

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
lib_deps =
    m5stack/M5Unified@0.2.2
    m5stack/M5GFX@0.2.36
    bblanchon/ArduinoJson@7.2.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -Wno-unused-variable

[env:core2]
board = m5stack-core2
board_upload.flash_size = 16MB
build_flags =
    ${env.build_flags}
    -mfix-esp32-psram-cache-issue

[env:cores3]
board = m5stack-cores3
board_upload.flash_size = 16MB
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; Core2 + Bluetooth A2DP audio to a car hands-free kit (CoreS3 has no Bluetooth Classic).
; Library is not in the PlatformIO registry: pinned git tag.
[env:core2_a2dp]
extends = env:core2
lib_deps =
    ${env.lib_deps}
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
build_flags =
    ${env:core2.build_flags}
    -DUSE_A2DP_OUT

; ---- M5StickC PLUS2: ESP32-PICO-V3-02, 8 MB flash, 2 MB PSRAM, 135x240 panel, buttons only ----
; PlatformIO has no board json for the Plus2: the m5stick-c definition is used (same ESP32 + pins);
; M5Unified/M5GFX auto-detect the Plus2 at run time. Flash size is overridden to 8 MB.
; The "-mfix-esp32-psram-cache-issue" flag of the Core2 env is not needed (PICO-V3-02 is silicon rev 3).
;   DASHIE_BUTTONS_ONLY : no touch, input = BtnA / BtnB / BtnPWR
;   DASHIE_NO_SPEAKER   : buzzer only, speech goes out over A2DP (env plus2_a2dp) or stays text
;   DASHIE_IMU_LAT_EXPR : IMU axis that is "sideways" when the stick lies landscape on the dash (unverified guess)
[env:plus2]
board = m5stick-c
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB
build_flags =
    ${env.build_flags}
    -DDASHIE_BUTTONS_ONLY
    -DDASHIE_NO_SPEAKER
    -DDASHIE_IMU_LAT_EXPR=ly

; Plus2 + Bluetooth A2DP audio to the car hands-free kit.
[env:plus2_a2dp]
extends = env:plus2
lib_deps =
    ${env.lib_deps}
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.8.7
build_flags =
    ${env:plus2.build_flags}
    -DUSE_A2DP_OUT
